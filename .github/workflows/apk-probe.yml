name: APK probe
# One-off: names of the parts of Discord's voice call controls.
on:
  push:
    branches: [apk-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download and look
        run: |
          set +e
          for mirror in https://tracker.vendetta.rocks https://tracker.vd.nexpid.xyz https://proxy.vd.ushie.dev; do
            curl -fsSL --retry 2 --max-time 300 -o base.apk "$mirror/tracker/download/354012/base" && break
          done
          unzip -q -o base.apk 'assets/index.android.bundle' && ls -la assets
          strings -n 6 assets/index.android.bundle > s.txt
          # Hermes keeps its strings packed together, so look for names inside them.
          look() { echo "== $1"; grep -a -o -E "$2" assets/index.android.bundle | sort | uniq -c | sort -rn | head -${3:-60}; }
          look soundboard '[A-Z][a-z]+[A-Za-z0-9]*Soundboard[A-Z][A-Za-z0-9]{2,40}|Soundboard[A-Z][A-Za-z0-9]{2,40}'
          look callcontrols '[A-Za-z0-9]{0,30}(CallControl|VoiceControl|ControlButton|ControlsButton|VoicePanel|CallBar|ControlBar|ControlTray|ActionBar|CallControlsTray|ControlsRow)[A-Za-z0-9]{0,30}' 120
          look screenshare '[A-Za-z0-9]{0,30}(ScreenShare|Screenshare)[A-Za-z0-9]{0,20}Button[A-Za-z0-9]{0,20}'
          look disconnect '[A-Za-z0-9]{0,30}(DisconnectButton|EndCallButton|HangUpButton|LeaveCallButton)[A-Za-z0-9]{0,20}'
          look video '[A-Za-z0-9]{0,30}(VideoButton|CameraButton|MuteButton|MicButton|MicrophoneButton)[A-Za-z0-9]{0,20}'
