name: APK probe
# One-off: names of the parts of Discord's voice call controls.
on:
  push:
    branches: [apk-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download and look
        run: |
          set +e
          for mirror in https://tracker.vendetta.rocks https://tracker.vd.nexpid.xyz https://proxy.vd.ushie.dev; do
            curl -fsSL --retry 2 --max-time 300 -o base.apk "$mirror/tracker/download/354012/base" && break
          done
          unzip -q -o base.apk 'assets/index.android.bundle' && ls -la assets
          strings -n 6 assets/index.android.bundle > s.txt
          echo "== soundboard"; grep -E '^[A-Z][A-Za-z0-9]*Soundboard[A-Za-z0-9]*$|^Soundboard[A-Za-z0-9]*(Button|Control)[A-Za-z0-9]*$' s.txt | sort -u | head -60
          echo "== call controls"; grep -E '^[A-Z][A-Za-z0-9]*(CallControl|VoiceControl|ControlButton|ControlsButton|ActionBar|CallButton|VoicePanel|CallBar|ControlBar|ControlTray|Controls)[A-Za-z0-9]*$' s.txt | sort -u | head -120
          echo "== screenshare"; grep -E '^[A-Z][A-Za-z0-9]*(ScreenShare|Screenshare)[A-Za-z0-9]*Button[A-Za-z0-9]*$' s.txt | sort -u | head -30
          echo "== disconnect"; grep -E '^[A-Z][A-Za-z0-9]*(Disconnect|EndCall|HangUp|Hangup)[A-Za-z0-9]*$' s.txt | sort -u | head -30
