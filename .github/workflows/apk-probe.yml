name: APK probe
# One-off: how Discord's WebRTC picks between Java AudioRecord and OpenSL ES for the mic.
on:
  push:
    branches: [apk-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download and look
        run: |
          set +e
          for mirror in https://tracker.vendetta.rocks https://tracker.vd.nexpid.xyz https://proxy.vd.ushie.dev; do
            curl -fsSL --retry 2 --max-time 300 -o base.apk "$mirror/tracker/download/354012/base" && break
          done
          mkdir dex && cd dex && unzip -q -o ../base.apk 'classes*.dex'
          look() { echo "== $1"; cat classes*.dex | grep -a -o -E "$2" | sort | uniq -c | sort -rn | head -${3:-40}; }
          look classes 'L[a-z/]*(webrtc|discord)[a-z/]*/(WebRtcAudio[A-Za-z]*|JavaAudioDeviceModule[A-Za-z$]*|AudioDeviceModule|OpenSLES[A-Za-z]*|LowLatency[A-Za-z]*|AudioRecord[A-Za-z]*);' 60
          look methods '(isLowLatency[A-Za-z]*|setBlacklistDeviceForOpenSLESUsage|isOpenSLES[A-Za-z]*|setUseOpenSLES|useOpenSLES[A-Za-z]*|OpenSLESUsage[A-Za-z]*|isAAudio[A-Za-z]*|setUseLowLatency[A-Za-z]*|useLowLatency[A-Za-z]*|setUseHardware[A-Za-z]*|isAcousticEchoCancelerSupported|setUseStereoInput|builder|setAudioSource)' 60
          cd .. && curl -fsSL --retry 2 -o arm.apk "https://tracker.vendetta.rocks/tracker/download/354012/config.arm64_v8a" && unzip -q -o arm.apk 'lib/arm64-v8a/libdiscord.so' -d so
          echo "== libdiscord audio strings"; strings so/lib/arm64-v8a/libdiscord.so | grep -E -i "opensl|aaudio|audio_layer|AudioLayer|LowLatency|WebRtcAudioRecord|JavaAudio|audio device|kAndroid|AudioRecordJni|OpenSLESRecorder" | sort -u | head -60
