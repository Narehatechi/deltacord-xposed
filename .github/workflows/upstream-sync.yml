name: Sync with Revenge

# Every day, brings in whatever Revenge changed since the last sync (renamed for Deltacord)
# and opens a pull request. Merging it releases the update.
on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/upstream-sync.py
