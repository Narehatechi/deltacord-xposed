name: Release

on:
  # A push to main releases the version in app/build.gradle.kts if that release doesn't exist yet.
  push:
    branches: [main]
    paths-ignore: ['**.md', 'assets/**']
  workflow_dispatch:
    inputs:
      versionName:
        description: Version name (e.g. 1.7.0)
        required: true
        type: string
      versionCode:
        description: Version code (e.g. 1700), also used as the release tag
        required: true
        type: number

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Keep in sync with `javaVersion` in gradle/libs.versions.toml.
  JAVA_VERSION: 25

jobs:
  release:
    name: Build & release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pick version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          IN_NAME: ${{ inputs.versionName }}
          IN_CODE: ${{ inputs.versionCode }}
        run: |
          if [ -n "$IN_NAME" ]; then
            VERSION_NAME="$IN_NAME"; VERSION_CODE="$IN_CODE"
          else
            VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
            VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          if gh release view "$VERSION_CODE" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION_CODE already exists; bump versionCode to release again."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate inputs
        if: steps.ver.outputs.skip != 'true'
        run: |
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid versionName: $VERSION_NAME"
            exit 1
          fi
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid versionCode: $VERSION_CODE"
            exit 1
          fi

      - name: Bump version
        if: steps.ver.outputs.skip != 'true' && github.event_name == 'workflow_dispatch'
        run: |
          sed -i -E \
            -e "s/^(\s*versionCode = ).*/\1$VERSION_CODE/" \
            -e "s/^(\s*versionName = ).*/\1\"$VERSION_NAME\"/" \
            app/build.gradle.kts
          git diff app/build.gradle.kts

          if git diff --quiet app/build.gradle.kts; then
            echo "Version unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: bump version to $VERSION_NAME ($VERSION_CODE)" app/build.gradle.kts
            git push
          fi

      - name: Setup JDK
        if: steps.ver.outputs.skip != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        if: steps.ver.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Decode keystore
        if: steps.ver.outputs.skip != 'true'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/signing-key.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/signing-key.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE secret, so the release is signed with a temporary debug key."
          fi

      - name: Build APKs
        if: steps.ver.outputs.skip != 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # Only KEYSTORE and KEYSTORE_PASSWORD are needed; the alias and key password default sensibly.
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'undercord' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Collect APKs
        if: steps.ver.outputs.skip != 'true'
        run: |
          mkdir dist
          mv app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          mv app/build/outputs/apk/release/app-release.apk dist/app-release.apk
          ls -l dist

      - name: Attest build provenance
        if: steps.ver.outputs.skip != 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.apk

      - name: Upload APKs
        if: steps.ver.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Create release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION_CODE" >/dev/null 2>&1; then
            echo "::error::Release $VERSION_CODE already exists."
            exit 1
          fi
          gh release create "$VERSION_CODE" \
            --target "$(git rev-parse HEAD)" \
            --title "$VERSION_NAME" \
            --generate-notes \
            dist/app-debug.apk dist/app-release.apk
