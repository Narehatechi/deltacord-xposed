name: Emulator test

# Runs Deltacord on an Android emulator, logged out (a fresh install), and keeps screenshots,
# Deltacord's startup record and the log. This is the state new users start in, and one nobody
# who already uses Deltacord sees, so it's checked here.
on:
  workflow_dispatch:
    inputs:
      discord:
        description: Discord version code
        default: "354012"
      bundle_url:
        description: Deltacord bundle to test (empty = the released one)
        default: ""
      wait:
        description: Seconds to watch after launch
        default: "70"
  push:
    branches: [emulator-test]

permissions:
  contents: write

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DISCORD: ${{ inputs.discord || '354012' }}
      BUNDLE_URL: ${{ inputs.bundle_url || vars.EMULATOR_BUNDLE_URL || '' }}
      WAIT: ${{ inputs.wait || '70' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build in a copy of Deltacord
        run: |
          # Which Deltacord to test: the workflow input, else .github/emulator-bundle.txt, else the released one.
          pinned=$(grep -v '^#' .github/emulator-bundle.txt 2>/dev/null | head -1 | tr -d '[:space:]')
          url="${BUNDLE_URL:-${pinned:-https://github.com/Narehatechi/deltacord-bundle/releases/latest/download/deltacord.min.js}}"
          echo "Testing bundle: $url"
          echo "BUNDLE_URL=$url" >> "$GITHUB_ENV"
          curl -fsSL --retry 3 -o app/src/main/assets/deltacord.bundle "$url"

      - name: Build the module
        run: ./gradlew :app:assembleDebug --no-daemon -q

      - name: Download Discord
        run: |
          mkdir -p discord
          for split in base config.x86_64 config.xxhdpi config.en; do
            ok=""
            for mirror in https://tracker.vendetta.rocks https://tracker.vd.nexpid.xyz https://proxy.vd.ushie.dev; do
              if curl -fsSL --retry 2 --max-time 300 -o "discord/$split.apk" "$mirror/tracker/download/$DISCORD/$split"; then ok=1; break; fi
            done
            [ -n "$ok" ] || { echo "::error::Couldn't download Discord's $split"; exit 1; }
          done
          ls -la discord

      - name: Download LSPatch
        run: |
          url=$(gh api repos/JingMatrix/LSPatch/releases/latest -q '.assets[] | select(.name | test("^jar.*\\.jar$")) | .browser_download_url' | head -1)
          [ -n "$url" ] || url=$(gh api repos/JingMatrix/LSPatch/releases -q '.[].assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -1)
          echo "LSPatch: $url"
          curl -fsSL --retry 3 -o lspatch.jar "$url"

      - name: Patch Discord with the module
        run: |
          module=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          java -jar lspatch.jar discord/base.apk discord/config.x86_64.apk discord/config.xxhdpi.apk discord/config.en.apk -m "$module" -l 0 -d -f -o patched
          ls -la patched

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/emulator-run.sh

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: results
          if-no-files-found: warn

      # Screenshots and records on a branch of their own, so they can be looked at from anywhere.
      - name: Publish the results
        if: always()
        run: |
          [ -d results ] || exit 0
          echo "Run ${{ github.run_id }} · Discord $DISCORD · bundle ${BUNDLE_URL:-released} · $(date -u +%FT%TZ)" > results/RUN.txt
          cd results
          git init -q -b emulator-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Emulator results for run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" emulator-results
